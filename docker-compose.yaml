version: "2.1"
  
networks:
  desafio-cleanarch-newtwork:
    ipam:
      driver: default
      config:
        - subnet: 172.42.12.0/29

services:
  app:
    build: .
    container_name: app
    ports:
      - "8080:8080"
      - "8000:8000"
      - "50051:50051"
    command: go run main.go wire_gen.go
    volumes:
      - .:/app
    networks:
      - desafio-cleanarch-newtwork
    tty: true
    depends_on:
      - migrate

  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=orders
      - MYSQL_PASSWORD=root
    ports:
      - 3306:3306
    volumes:
      - .docker/mysql:/var/lib/mysql
    networks:
      - desafio-cleanarch-newtwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 3

  # phpmyadmin
  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin
    restart: always
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - desafio-cleanarch-newtwork
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - desafio-cleanarch-newtwork

  migrate:
    image: migrate/migrate
    networks:
      - desafio-cleanarch-newtwork
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "mysql://root:root@tcp(mysql:3306)/orders", "-verbose", "up"]
    depends_on:
      mysql:
        condition: service_healthy
